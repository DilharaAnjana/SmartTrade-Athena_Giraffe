        <!-- Start Header -->
        <div class="signin-header">
            <div class="row align-items-center">
                <div class="col-sm-4">
                    <a href="index.html" style="text-decoration:none !important;">
                        <span style="font-family:'Orbitron',monospace;font-size:20px;font-weight:900;letter-spacing:0.1em;background:linear-gradient(135deg,#00ff88,#00b4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">NEONGEAR</span>
                    </a>
                </div>
                <div class="col-sm-8">
                    <div class="singin-header-btn">
                        <p>Not a member?</p>

                    </div>
                </div>
            </div>

        <!-- End Header -->

        <div class="row">
            <div class="col-xl-4 col-lg-6">
                <div class="axil-signin-banner bg_image bg_image--10">
                    <div style="text-align:center;z-index:1;position:relative;">
                        <div style="font-size:64px;margin-bottom:24px;">🎮</div>
                        <h3 class="title" style="font-size:28px !important;">Level Up Your Gaming Rig</h3>
                        <p style="color:#8888aa;font-family:'Rajdhani',sans-serif;font-size:16px;margin-top:16px;line-height:1.6;">
                            Access exclusive deals on premium GPUs, CPUs, RAM, and more.
                        </p>
                        <div style="display:flex;justify-content:center;gap:16px;margin-top:32px;flex-wrap:wrap;">
                            <div style="background:rgba(0,255,136,0.08);border:1px solid rgba(0,255,136,0.2);border-radius:8px;padding:12px 20px;">
                                <span style="font-family:'Orbitron',monospace;font-size:20px;font-weight:800;color:#00ff88;display:block;">10K+</span>
                                <span style="font-size:11px;color:#555570;font-family:'Rajdhani',sans-serif;text-transform:uppercase;letter-spacing:0.1em;">Products</span>
                            </div>
                            <div style="background:rgba(0,180,255,0.08);border:1px solid rgba(0,180,255,0.2);border-radius:8px;padding:12px 20px;">
                                <span style="font-family:'Orbitron',monospace;font-size:20px;font-weight:800;color:#00b4ff;display:block;">50+</span>
                                <span style="font-size:11px;color:#555570;font-family:'Rajdhani',sans-serif;text-transform:uppercase;letter-spacing:0.1em;">Brands</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-6 offset-xl-2">
                <div class="axil-signin-form-wrap">
                    <div class="axil-signin-form">
                        <h3 class="title">Sign in to NeonGear</h3>
                        <p class="b2 mb--10">Welcome back, gamer. Access your account to track orders and discover the latest components.</p>
                        
                        <p class="text-danger" id="message"></p>
                        
                        <form class="singin-form">
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" class="form-control" value="" id="email">
                            </div>
                            <div class="form-group">
                                <label>Password</label>
                                <input type="password" class="form-control" value="" id="password">
                            </div>
                            <div class="form-group d-flex align-items-center justify-content-between">
                                <button type="button" class="axil-btn btn-bg-primary submit-btn" onclick="signIn();">Sign In</button>
                                <a href="verify-account.html" class="forgot-btn">Verify Your Account</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
