<html class="no-js" lang="en">

    <head>
        <meta charset="utf-8">
        <meta http-equiv="x-ua-compatible" content="ie=edge">
        <title>NeonGear | Create Account</title>
        <meta name="description" content="Create your NeonGear gaming account and start shopping premium components.">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <link rel="shortcut icon" type="image/x-icon" href="assets/images/favicon.png">

        <link rel="stylesheet" href="assets/css/vendor/bootstrap.min.css">
        <link rel="stylesheet" href="assets/css/vendor/font-awesome.css">
        <link rel="stylesheet" href="assets/css/vendor/flaticon/flaticon.css">
        <link rel="stylesheet" href="assets/css/vendor/slick.css">

        <link rel="stylesheet" href="assets/css/vendor/magnific-popup.css">
        <link rel="stylesheet" href="assets/css/vendor/base.css">

        <link rel="stylesheet" href="assets/css/gaming.css">
        <link rel="stylesheet" href="assets/css/notification.css">

    </head>


    <body>
        <div class="axil-signin-area">

            <!-- Start Header -->
            <div class="signin-header">
                <div class="row align-items-center">
                    <div class="col-md-6">
                        <a href="index.html" style="text-decoration:none !important;">
                            <span style="font-family:'Orbitron',monospace;font-size:20px;font-weight:900;letter-spacing:0.1em;background:linear-gradient(135deg,#00ff88,#00b4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">NEONGEAR</span>
                        </a>
                    </div>
                    <div class="col-md-6">
                        <div class="singin-header-btn">
                            <p>Already a member?</p>
                            <a href="sign-in.html" class="axil-btn btn-bg-secondary sign-up-btn">Sign In</a>
                        </div>
                    </div>
                </div>
            </div>
            <!-- End Header -->

            <div class="row">
                <div class="col-xl-4 col-lg-6">
                    <div class="axil-signin-banner bg_image bg_image--10">
                        <div style="text-align:center;z-index:1;position:relative;">
                            <div style="font-size:64px;margin-bottom:24px;">🚀</div>
                            <h3 class="title" style="font-size:28px !important;">Join the NeonGear Community</h3>
                            <p style="color:#8888aa;font-family:'Rajdhani',sans-serif;font-size:15px;margin-top:12px;">
                                Get access to exclusive deals, early product launches, and expert PC building guides.
                            </p>
                        </div>
                    </div>
                </div>
                <div class="col-lg-6 offset-xl-2">
                    <div class="axil-signin-form-wrap">
                        <div class="axil-signin-form">
                            <h3 class="title">Create Your Account</h3>
                            <p class="b2 mb--10">Join NeonGear to shop premium gaming components with fast delivery and expert support.</p>
                            
                            <p class="text-danger" id="message"></p>
                            
                            <form class="singin-form">
                                <div class="form-group">
                                    <label>First Name</label>
                                    <input type="text" id="firstName" class="form-control" value="">
                                </div>
                                <div class="form-group">
                                    <label>Last Name</label>
                                    <input type="text" id="lastName" class="form-control" value="">
                                </div>
                                <div class="form-group">
                                    <label>Email</label>
                                    <input type="email" id="email" class="form-control" value="">
                                </div>
                                <div class="form-group">
                                    <label>Password</label>
                                    <input type="password" id="password" class="form-control" value="">
                                </div>
                                <div class="form-group">
                                    <button type="button" class="axil-btn btn-bg-primary submit-btn" onclick="signUp();">Create Account</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- JS
    ============================================ -->
        <!-- Modernizer JS -->
        <script src="assets/js/vendor/modernizr.min.js"></script>

        <script src="assets/js/vendor/jquery.js"></script>

        <script src="assets/js/vendor/jquery.magnific-popup.min.js"></script>
        <script src="assets/js/vendor/imagesloaded.pkgd.min.js"></script>
        <script src="assets/js/vendor/isotope.pkgd.min.js"></script>
        <script src="assets/js/vendor/counterup.js"></script>
        <script src="assets/js/vendor/waypoints.min.js"></script>

        <!-- Main JS -->
        <script src="assets/js/main.js"></script>
        <script src="assets/js/notification.js"></script>
        <script src="assets/js/notiflix-aio-3.2.8.min.js"></script>
        <script src="assets/js/sign-up.js"></script>
    </body>

</html>
