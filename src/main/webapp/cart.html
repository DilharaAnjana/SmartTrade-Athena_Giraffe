<body class="sticky-header" id="cart-body">

<a href="#top" class="back-to-top" id="backto-top"><i class="fal fa-arrow-up"></i></a>
<!-- Start Header -->
<header class="header axil-header header-style-1">
    <header-content></header-content>
</header>
<!-- End Header -->

<main class="main-wrapper">

    <!-- Start Cart Area  -->
    <div class="axil-product-cart-area axil-section-gap">
        <div class="container">
            <div class="axil-product-cart-wrap">
                <div class="product-table-heading">
                    <h4 class="title" style="font-family:'Orbitron',monospace;background:linear-gradient(135deg,#00ff88,#00b4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">
                        <i class="fas fa-shopping-cart" style="-webkit-text-fill-color:#00ff88;margin-right:10px;font-size:20px;"></i>Your Cart
                    </h4>
                    <a href="#" class="cart-clear" style="color:#ff2d78 !important;font-size:13px;font-family:'Rajdhani',sans-serif;letter-spacing:0.05em;border:1px solid rgba(255,45,120,0.3);padding:6px 16px;border-radius:6px;">
                        <i class="fas fa-trash-alt" style="margin-right:4px;"></i>Clear Cart
                    </a>
                </div>
                <div class="table-responsive">
                    <table class="table axil-product-table axil-cart-table mb--40">
                        <thead>
                        <tr>
                            <th scope="col" class="product-remove"></th>
                            <th scope="col" class="product-thumbnail">Product</th>
                            <th scope="col" class="product-title"></th>
                            <th scope="col" class="product-price">Price</th>
                            <th scope="col" class="product-quantity">Quantity</th>
                            <th scope="col" class="product-subtotal">Subtotal</th>
                        </tr>
                        </thead>
                        <tbody id="cart-item-container">

                        <tr id="cart-item-row">
                            <td class="product-remove"><a href="#" class="remove-wishlist"><i class="fal fa-times"></i></a>
                            </td>
                            <td class="product-thumbnail"><a href="#"><img src="assets/images/product/product-01.png"
                                                                           alt="Product"></a></td>
                            <td class="product-title"><a href="#">Title</a></td>
                            <td class="product-price" data-title="Price"><span class="currency-symbol">Rs. </span><span>100,000.00</span>
                            </td>
                            <td class="product-quantity" data-title="Qty">
                                <div class="pro-qty">
                                    <input type="number" class="quantity-input" value="1">
                                </div>
                            </td>
                            <td class="product-subtotal" data-title="Subtotal"><span class="currency-symbol">Rs. </span><span>100,000.00</span>
                            </td>
                        </tr>

                        </tbody>
                    </table>
                </div>

                <div class="row">
                    <div class="col-xl-5 col-lg-7 offset-xl-7 offset-lg-5">
                        <div class="axil-order-summery mt--20">
                            <h5 class="title mb--20">Order Summary</h5>
                            <div class="summery-table-wrap">
                                <table class="table summery-table mb--30">
                                    <tbody>
                                    <tr class="order-subtotal">
                                        <td>Quantities</td>
                                        <td class="order-total-amount" id="order-total-quantity">0</td>
                                    </tr>
                                    <tr class="order-total">
                                        <td>Total</td>
                                        <td class="order-total-amount">Rs. <span
                                                id="order-total-amount">0</span></td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                            <a href="checkout.html" class="axil-btn btn-bg-primary checkout-btn" style="width:100%;text-align:center;display:block;margin-top:16px;">
                                <i class="fas fa-bolt" style="margin-right:6px;"></i>Proceed to Checkout
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- End Cart Area  -->

</main>


<div class="axil-why-choose-area pb--50 pb_sm--30">
    <div class="container">
        <div class="row row-cols-xl-4 row-cols-sm-2 row-cols-1 row--20">
            <div class="col">
                <div class="service-box">
                    <div class="icon" style="font-size:32px;margin-bottom:4px;">🚀</div>
                    <h6 class="title">Fast &amp; Secure Delivery</h6>
                </div>
            </div>
            <div class="col">
                <div class="service-box">
                    <div class="icon" style="font-size:32px;margin-bottom:4px;">🛡️</div>
                    <h6 class="title">30-Day Money Back</h6>
                </div>
            </div>
            <div class="col">
                <div class="service-box">
                    <div class="icon" style="font-size:32px;margin-bottom:4px;">🔒</div>
                    <h6 class="title">Secure Checkout</h6>
                </div>
            </div>
            <div class="col">
                <div class="service-box">
                    <div class="icon" style="font-size:32px;margin-bottom:4px;">💬</div>
                    <h6 class="title">24/7 Expert Support</h6>
                </div>
            </div>
        </div>
    </div>
</div>
