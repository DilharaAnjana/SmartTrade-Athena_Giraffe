    <!-- Start Header -->
    <div class="signin-header">
        <div class="row align-items-center">
            <div class="col-xl-4 col-sm-6">
                <a href="index.html" style="text-decoration:none !important;">
        <span style="font-family:'Orbitron',monospace;font-size:20px;font-weight:900;letter-spacing:0.1em;background:linear-gradient(135deg,#00ff88,#00b4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">NEONGEAR</span>
    </a>
            </div>
            <div class="col-md-2 d-lg-block d-none">
                <a href="sign-up.html" class="back-btn"><i class="far fa-angle-left"></i></a>
            </div>
            <div class="col-xl-6 col-lg-4 col-sm-6">
                <div class="singin-header-btn">
                    <p>Already a member?</p>
                    <a href="sign-in.html" class="sign-up-btn axil-btn btn-bg-secondary">Sign In</a>
                </div>
            </div>
        </div>
    </div>
    <!-- End Header -->

    <div class="row">
        <div class="col-xl-4 col-lg-6">
            <div class="axil-signin-banner bg_image bg_image--10">
                <div style="text-align:center;z-index:1;position:relative;">
                    <div style="font-size:64px;margin-bottom:24px;">🔐</div>
                    <h3 class="title" style="font-size:28px !important;">Secure Your Account</h3>
                    <p style="color:#8888aa;font-family:'Rajdhani',sans-serif;font-size:15px;margin-top:12px;">
                        Verify your email to unlock full access to NeonGear's premium gaming store.
                    </p>
                </div>
            </div>
        </div>
        <div class="col-lg-6 offset-xl-2">
            <div class="axil-signin-form-wrap">
                <div class="axil-signin-form">
                    <h3 class="title">Verify Your Account</h3>
                    <p class="b2 mb--10">Check your email for the verification code to activate your NeonGear account and start shopping.</p>

                    <p class="text-danger" id="message"></p>

                    <form class="singin-form">
                        <div class="form-group">
                            <label>Verification Code</label>
                            <input type="text" class="form-control" value="" id="verificationCode">
                        </div>
                        <div class="form-group">
                            <button type="button" class="axil-btn btn-bg-primary submit-btn" onclick="verifyAccount();">Verify & Continue</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
